name: 轻云出岫 · 自用版云端构建

on:
  workflow_dispatch:
    inputs:
      bundle_id:
        description: 新的主应用标识（不要使用原版标识）
        required: true
        default: com.local.qingyun
        type: string
      display_name:
        description: 桌面显示名称
        required: true
        default: 轻云出岫
        type: string
      regressions_only:
        description: 只重跑回归，不重复生成已通过的真机包
        required: false
        default: false
        type: boolean

      build_only:
        description: 仅重跑真机打包，复用同一应用代码的通过回归
        required: false
        default: false
        type: boolean

      regression_scope:
        description: 验证范围（已通过的应用不必重复打包）
        required: false
        default: all
        type: choice
        options:
          - all
          - settings-ui
          - chapter-title
          - toc-pins
          - ui-polish
          - module-compat
          - ranked-home

permissions:
  contents: read


jobs:
  regressions:
    if: ${{ !inputs.build_only }}
    name: 核查首页、底栏与阅读菜单回归
    runs-on: xcode-27
    timeout-minutes: 70
    steps:
      - name: 获取所选分支源码
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: 运行定向 iOS 模拟器测试
        env:
          TEST_BUNDLE_ID: ${{ inputs.bundle_id }}
          TEST_DISPLAY_NAME: ${{ inputs.display_name }}
          QINGYUN_REGRESSION_SCOPE: ${{ inputs.regression_scope }}
        run: bash scripts/test_qingyun_regressions.sh
      - name: 保存回归日志和结果
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 轻云出岫-回归-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            trollstore-output/regressions.log
            trollstore-output/regressions.xcresult.zip
            trollstore-output/layout-preview/
          if-no-files-found: warn
          retention-days: 7
  build:
    if: ${{ !inputs.regressions_only }}
    name: 编译并生成真机测试 IPA
    runs-on: xcode-27
    timeout-minutes: 90
    steps:
      - name: 获取所选分支的源码
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: 准备独立配置、真实编译并打包
        env:
          TEST_BUNDLE_ID: ${{ inputs.bundle_id }}
          TEST_DISPLAY_NAME: ${{ inputs.display_name }}
        run: bash scripts/build_trollstore_test.sh
      - name: 保存成功生成的 IPA
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: 轻云出岫-IPA-${{ github.run_id }}-${{ github.run_attempt }}
          path: trollstore-output/*.ipa
          if-no-files-found: error
          retention-days: 3
          compression-level: 0
      - name: 保存已过滤的构建日志
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 轻云出岫-日志-${{ github.run_id }}-${{ github.run_attempt }}
          path: trollstore-output/build.log
          if-no-files-found: warn
          retention-days: 7
