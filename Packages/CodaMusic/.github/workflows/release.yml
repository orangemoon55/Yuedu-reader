name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  APP_NAME: Coda
  SPARKLE_VERSION: "2.9.5"
  SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
  CODA_SPARKLE_PUBLIC_ED_KEY: ${{ vars.CODA_SPARKLE_PUBLIC_ED_KEY }}

jobs:
  release:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history: build number = commit count

      - name: Validate Coda release credentials
        env:
          CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          NOTARY_ID: ${{ secrets.APPLE_ID }}
          NOTARY_TEAM: ${{ secrets.APPLE_TEAM_ID }}
          NOTARY_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          UPDATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          # Developer ID signing and notarization are optional. With none of
          # their credentials the Mac app ships ad-hoc signed; a partial set
          # is treated as a mistake rather than silently downgraded.
          count_set() { local n=0; for key in "$@"; do [ -n "${!key}" ] && n=$((n + 1)); done; echo $n; }
          SIGNING_KEYS="SIGN_IDENTITY CERTIFICATE CERTIFICATE_PASSWORD NOTARY_ID NOTARY_TEAM NOTARY_PASSWORD"
          SIGNING_SET=$(count_set $SIGNING_KEYS)
          if [ "$SIGNING_SET" -eq 6 ]; then
            echo "MAC_SIGNING=developer-id" >> "$GITHUB_ENV"
          elif [ "$SIGNING_SET" -eq 0 ]; then
            echo "::notice::No Developer ID credentials; the Mac app will be ad-hoc signed and not notarized."
            echo "MAC_SIGNING=adhoc" >> "$GITHUB_ENV"
          else
            for key in $SIGNING_KEYS; do [ -z "${!key}" ] && echo "Missing Coda release credential: $key" >&2; done
            exit 1
          fi
          # Sparkle updates need both halves of the EdDSA key pair, or neither.
          UPDATE_SET=$(count_set UPDATE_KEY CODA_SPARKLE_PUBLIC_ED_KEY)
          if [ "$UPDATE_SET" -eq 2 ]; then
            echo "MAC_UPDATES=1" >> "$GITHUB_ENV"
          elif [ "$UPDATE_SET" -eq 0 ]; then
            echo "::notice::No Sparkle key; in-app updates stay disabled and no appcast is published."
            echo "MAC_UPDATES=0" >> "$GITHUB_ENV"
          else
            echo "Set both SPARKLE_PRIVATE_KEY and the CODA_SPARKLE_PUBLIC_ED_KEY variable, or neither" >&2
            exit 1
          fi
          source Scripts/app-identity.sh
          [ "$GITHUB_REPOSITORY" = "$REPO" ] || { echo "Release repository mismatch" >&2; exit 1; }
          echo "APP_NAME=$APP_NAME" >> "$GITHUB_ENV"

      - name: Derive version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "BUILD_NUMBER=$(git rev-list --count HEAD)" >> "$GITHUB_ENV"

      - name: Extract release notes from CHANGELOG.md
        run: |
          Scripts/release-notes.sh "$VERSION" > "$RUNNER_TEMP/notes.md"
          Scripts/release-notes.sh "$VERSION" --html > "$RUNNER_TEMP/$APP_NAME-$VERSION.html"
          if [ "$MAC_SIGNING" = adhoc ]; then
            cat docs/release/unsigned-mac-install.md >> "$RUNNER_TEMP/notes.md"
          fi
          echo "Release notes for $VERSION:"
          cat "$RUNNER_TEMP/notes.md"

      - name: Import signing certificate
        if: env.MAC_SIGNING == 'developer-id'
        env:
          MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/build.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          echo "$MACOS_CERTIFICATE_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" \
            -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: \
            -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null
          security list-keychains -d user -s "$KEYCHAIN" login.keychain-db
          rm -f "$RUNNER_TEMP/cert.p12"

      - name: Build app (universal)
        run: |
          MARKETING_VERSION="$VERSION" BUILD_NUMBER="$BUILD_NUMBER" \
            ARCHES="arm64 x86_64" \
            Scripts/build-app.sh release

      - name: Codesign (Developer ID, hardened runtime)
        if: env.MAC_SIGNING == 'developer-id'
        run: |
          APP=".build/app/$APP_NAME.app"
          FW="$APP/Contents/Frameworks/Sparkle.framework"
          codesign -f -o runtime --preserve-metadata=entitlements \
            -s "$SIGN_IDENTITY" "$FW/Versions/B/XPCServices/Downloader.xpc"
          codesign -f -o runtime --preserve-metadata=entitlements \
            -s "$SIGN_IDENTITY" "$FW/Versions/B/XPCServices/Installer.xpc"
          codesign -f -o runtime -s "$SIGN_IDENTITY" "$FW/Versions/B/Autoupdate"
          codesign -f -o runtime -s "$SIGN_IDENTITY" "$FW/Versions/B/Updater.app"
          codesign -f -o runtime -s "$SIGN_IDENTITY" "$FW"
          codesign -f -o runtime -s "$SIGN_IDENTITY" "$APP"
          codesign --verify --deep --strict "$APP"

      - name: Codesign (ad-hoc)
        if: env.MAC_SIGNING == 'adhoc'
        run: |
          # Without a Developer ID, sign every nested component ad-hoc so the
          # bundle verifies and runs on Apple silicon. No hardened runtime:
          # library validation would refuse Sparkle's differently signed code.
          APP=".build/app/$APP_NAME.app"
          codesign --force --deep --sign - "$APP"
          codesign --verify --deep --strict "$APP"

      - name: Notarize and staple
        if: env.MAC_SIGNING == 'developer-id'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          APP=".build/app/$APP_NAME.app"
          ditto -c -k --keepParent "$APP" "$RUNNER_TEMP/notarize.zip"
          xcrun notarytool submit "$RUNNER_TEMP/notarize.zip" \
            --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_APP_PASSWORD" --wait
          xcrun stapler staple "$APP"
          spctl -a -vv --type execute "$APP"

      - name: Package and generate appcast
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          mkdir -p dist
          ditto -c -k --keepParent ".build/app/$APP_NAME.app" "dist/$APP_NAME-$VERSION.zip"
          if [ "$MAC_UPDATES" != 1 ]; then exit 0; fi
          cp "$RUNNER_TEMP/$APP_NAME-$VERSION.html" dist/

          curl -sL -o "$RUNNER_TEMP/sparkle.tar.xz" \
            "https://github.com/sparkle-project/Sparkle/releases/download/$SPARKLE_VERSION/Sparkle-$SPARKLE_VERSION.tar.xz"
          mkdir -p "$RUNNER_TEMP/sparkle"
          tar -xJf "$RUNNER_TEMP/sparkle.tar.xz" -C "$RUNNER_TEMP/sparkle"

          printf '%s' "$SPARKLE_PRIVATE_KEY" | \
            "$RUNNER_TEMP/sparkle/bin/generate_appcast" \
              --ed-key-file - \
              --embed-release-notes \
              --download-url-prefix "https://github.com/${GITHUB_REPOSITORY}/releases/download/v$VERSION/" \
              -o dist/appcast.xml \
              dist
          rm -f "dist/$APP_NAME-$VERSION.html"
          cat dist/appcast.xml

      - name: Build unsigned iOS IPA
        run: |
          xcodebuild -workspace ios/CodaIOS.xcworkspace -scheme CodaIOS \
            -configuration Release -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/ios-dd" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            MARKETING_VERSION="$VERSION" CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            build
          APP="$RUNNER_TEMP/ios-dd/Build/Products/Release-iphoneos/CodaIOS.app"
          mkdir -p "$RUNNER_TEMP/payload/Payload"
          cp -R "$APP" "$RUNNER_TEMP/payload/Payload/"
          (cd "$RUNNER_TEMP/payload" && zip -qry "$GITHUB_WORKSPACE/dist/$APP_NAME-iOS-$VERSION.ipa" Payload)
          ls -la dist/

      - name: Generate AltStore source
        run: |
          bash Scripts/altstore-source.sh "$VERSION" \
            "dist/$APP_NAME-iOS-$VERSION.ipa" "$RUNNER_TEMP/notes.md" \
            > dist/altstore.json
          cat dist/altstore.json

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ASSETS=("dist/$APP_NAME-$VERSION.zip" "dist/$APP_NAME-iOS-$VERSION.ipa" dist/altstore.json)
          [ -f dist/appcast.xml ] && ASSETS+=(dist/appcast.xml)
          # Re-tagging a version replaces its earlier release instead of failing.
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release delete "$GITHUB_REF_NAME" --yes
          fi
          gh release create "$GITHUB_REF_NAME" \
            --title "$APP_NAME $VERSION" \
            --notes-file "$RUNNER_TEMP/notes.md" \
            "${ASSETS[@]}"

